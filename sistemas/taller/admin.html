<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel · Motor Sur</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/admin.css">
<style>
:root{--a:#1F5BFF;--a2:#FFC531;--bg:#F1F3F8;--side:#0B1D3A;--sidei:#E6EDFF;--ln:#DFE4EE;--fd:"Barlow Condensed",Impact,sans-serif}
body{font-family:"Barlow",system-ui,sans-serif}
.top h1{text-transform:uppercase;font-size:2.2rem}
.tablero{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:#E4E8F1;border-radius:14px;padding:10px;min-height:140px}
.col h2{font:800 .8rem "Barlow";letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:2px 4px 10px;display:flex;justify-content:space-between}
.col.alerta{background:#FCE3E3}
.ord{display:block;width:100%;text-align:left;background:var(--card);border:1px solid transparent;border-radius:12px;padding:8px;margin-bottom:8px;cursor:pointer}
.ord:hover{border-color:var(--a)}
.ord img{width:100%;height:84px;object-fit:cover;border-radius:8px;margin-bottom:6px}
.ord b{display:block}.ord small{display:block;color:var(--mut)}
.ord.tarde{border-left:4px solid var(--bad)}
.placa{display:inline-block;font:700 .8rem ui-monospace,monospace;background:#fff;border:1.5px solid #0B1D3A;border-radius:5px;padding:1px 6px;letter-spacing:.04em}
.subir2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.subir2 img{width:70px;height:52px;object-fit:cover;border-radius:8px}
.bitA{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}
.bitA img{width:90px;height:66px;object-fit:cover;border-radius:8px}
dialog.ancho{width:min(940px,calc(100vw - 24px))}
.inv{display:flex;flex-wrap:wrap;gap:6px 14px}
</style>
</head>
<body>
<div class="adm" hidden id="app">
  <nav class="side" aria-label="Panel">
    <div class="marca"><span style="display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#1F5BFF">⚙</span><div>MOTOR SUR<small>Panel del taller</small></div></div>
    <a href="#inicio"><svg viewBox="0 0 24 24"><path d="M4 5h4v14H4zM10 5h4v10h-4zM16 5h4v6h-4z"/></svg>Tablero<span class="n" id="nTab" hidden></span></a>
    <a href="#recepcion"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Recibir auto</a>
    <a href="#citas"><svg viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg>Citas<span class="n" id="nCit" hidden></span></a>
    <a href="#refacciones"><svg viewBox="0 0 24 24"><path d="M14 6l4 4-8 8H6v-4zM16 4l4 4"/></svg>Refacciones<span class="n" id="nRef" hidden></span></a>
    <a href="#clientes"><svg viewBox="0 0 24 24"><path d="M5 17h14l-1.5-5h-11zM6.5 12L8 7h8l1.5 5M7 17v2M17 17v2"/></svg>Clientes y autos</a>
    <a href="#recordatorios"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg>Recordatorios<span class="n" id="nRec" hidden></span></a>
    <a href="#mecanicos"><svg viewBox="0 0 24 24"><path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></svg>Mecánicos</a>
    <a href="#caja"><svg viewBox="0 0 24 24"><path d="M3 6h18v12H3zM3 10h18M7 15h3"/></svg>Caja</a>
    <a href="#ajustes"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M16 4v4M10 10v4M18 16v4"/></svg>Ajustes</a>
    <a href="index.html" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>Ver sitio y portal</a>

    <p class="pie">Demo de NarIT. Los datos se guardan solo en este navegador.</p>
  </nav>
  <main class="cont" id="vista"></main>
</div>
<dialog id="dlg"></dialog>
<script type="module" src="admin.js"></script>

</html>
