<head>
<meta charset="utf-8">

<title>Panel · Óptica Mirada</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_base/admin.css">
<style>
:root{--a:#4B4FD1;--a2:#B9BBFF;--bg:#F2F3F8;--side:#1C1F33;--sidei:#E8E9FB;--ln:#E2E4EE;--fd:"Instrument Serif",Georgia,serif}
body{font-family:"Inter",system-ui,sans-serif}
.top h1,.kpi b{font-weight:400}
.tablero{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:#E9EAF2;border-radius:14px;padding:10px;min-height:120px}
.col h2{font:700 .78rem system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:2px 4px 10px;display:flex;justify-content:space-between}
.ord{background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;display:block;width:100%;text-align:left}
.ord:hover{border-color:var(--a)}
.ord.tarde{border-left:4px solid var(--bad)}
.ord b{display:block}.ord small{color:var(--mut);display:block}
.grad{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
.grad th,.grad td{padding:6px;text-align:center;border:1px solid var(--ln)}
.grad th{font-size:.72rem;color:var(--mut);text-transform:uppercase}
.grad input{width:100%;max-width:80px;padding:6px;border:1px solid var(--ln);border-radius:8px;text-align:center}
.arms{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;max-height:260px;overflow:auto}
.arms label{border:1px solid var(--ln);border-radius:12px;padding:6px;cursor:pointer;font-size:.8rem;display:grid;gap:4px;background:#fff}
.arms label:has(input:checked){border-color:var(--a);box-shadow:0 0 0 2px var(--a2)}
.arms img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}
.arms input{position:absolute;opacity:0}
.tot{font-size:1.3rem}
dialog.ancho{width:min(920px,calc(100vw - 24px))}
@media print{body *{visibility:hidden}#imprimir,#imprimir *{visibility:visible}#imprimir{position:fixed;inset:0;padding:20px;background:#fff}}
</style>
</head>
<body>
<div class="adm" hidden id="app">
  <nav class="side" aria-label="Panel">
