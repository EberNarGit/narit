<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Guía de ventas · NarIT</title>
<style>
:root{--bg:#F3F7F2;--card:#fff;--ink:#12261C;--mut:#5A6E62;--ln:#D6E2D8;--g:#157347;--g2:#0B3D26;--lime:#C8F169;--red:#B3261E;--amb:#8A5A00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:0}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
aside{background:var(--g2);color:#E8F5EC;padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:1.15rem;margin-bottom:2px}
aside small{color:#A9C9B6}
#q{width:100%;margin:12px 0 8px;padding:10px 12px;border-radius:10px;border:0;background:#fff;color:var(--ink)}
.lista button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:8px 10px;border-radius:8px;cursor:pointer}
.lista button:hover{background:#ffffff1a}
.lista button[aria-current=true]{background:var(--lime);color:var(--g2);font-weight:700}
.lista .sec{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#A9C9B6;margin:14px 10px 4px}
.lista i{font-style:normal;font-size:.75rem;opacity:.8}
main{min-width:0;padding:24px clamp(16px,4vw,48px) 80px;max-width:980px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:6px}
.top h2{font-size:clamp(1.6rem,4vw,2.3rem)}
.tag{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--g);font-weight:700}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none;font-weight:600}
.btn.sec{background:#fff;color:var(--g2);border:1px solid var(--ln)}
.tabs{display:flex;gap:6px;overflow:auto;margin:16px 0;padding-bottom:4px;position:sticky;top:0;background:var(--bg);z-index:2}
.tabs button{white-space:nowrap;background:#fff;border:1px solid var(--ln);border-radius:999px;padding:8px 14px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--g2);color:#fff;border-color:var(--g2)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:14px}
.card h3{font-size:1.02rem;margin-bottom:8px;color:var(--g2)}
.card p{margin:0 0 8px}
.card ul,.card ol{margin:0;padding-left:20px}
.card li{margin:4px 0}
.dolor{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--ln)}
.dolor:first-of-type{border-top:0}
.dolor input,.chk input{width:22px;height:22px;accent-color:var(--g);margin-top:2px}
.dolor b{display:block}
.cuesta{color:var(--red);font-size:.93rem}
.sol{color:var(--g);font-size:.93rem;font-weight:600}
.chk{display:flex;gap:10px;align-items:start;padding:6px 0}
textarea{width:100%;min-height:90px;border:1px solid var(--ln);border-radius:10px;padding:10px;background:#fff}
.speech p{font-size:1.12rem;line-height:1.6}
.speech .gancho{font-size:1.35rem;font-weight:700;color:var(--g2)}
.fases{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fases .card{margin:0}
.fases .n{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g)}
details{border-top:1px solid var(--ln);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:700}
details p{margin:8px 0 0;padding-left:14px;border-left:3px solid var(--lime)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.calc label{display:block;font-size:.9rem;color:var(--mut)}
.calc input{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;font-size:1.2rem;font-weight:700;background:#fff}
.res{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.res div{background:var(--g2);color:#fff;border-radius:12px;padding:14px}
.res b{display:block;font-size:1.7rem;color:var(--lime)}
.nota{font-size:.88rem;color:var(--mut)}
.ok{color:var(--g);font-weight:700;margin-left:8px}
[hidden]{display:none!important}
@media(max-width:820px){
 .app{grid-template-columns:1fr}
 aside{position:static;height:auto;max-height:46vh}
 .fases,.calc,.res{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Guía de ventas NarIT</h1>
    <small>Uso interno · 24 rubros</small>
    <input id="q" type="search" placeholder="Buscar negocio…" aria-label="Buscar negocio">
    <nav class="lista" id="lista" aria-label="Rubros"></nav>
  </aside>
  <main id="main"></main>
</div>

<script src="datos-a.js"></script>
<script src="datos-b.js"></script>
<script src="datos-c.js"></script>
<script>
const SITIO = 'https://ebernargit.github.io/narit/';
const $ = (s, r = document) => r.querySelector(s);
// Los textos son míos (datos-*.js), pero el nombre del cliente y las notas se escriben a mano: se escapan.
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pesos = (n) => '$' + Math.round(n).toLocaleString('es-MX');
const mem = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('narit-guia:' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('narit-guia:' + k, JSON.stringify(v)); } catch {} },
};

// Autochequeo: los 24 rubros completos. Si falla, se ve en la consola y en pantalla.
const CAMPOS = ['s', 'n', 'sec', 'e', 'd', 'q', 'sp', 'f', 'a', 'k', 'o', 'demo', 'c'];
const malos = R.filter((r) => CAMPOS.some((c) => !r[c]) || r.d.some((d) => d.length !== 3) || r.sp.length !== 3 || r.f.length !== 3 || r.c.length !== 5);
console.assert(R.length === 24 && !malos.length, 'Guía incompleta', R.length, malos.map((r) => r.s));

const TABS = [['entender', 'Entender'], ['diag', 'Diagnóstico'], ['speech', 'Speech'], ['impl', 'Qué implementar'], ['obj', 'Objeciones'], ['num', 'Números'], ['prop', 'Propuesta']];
let actual = mem.get('actual', '_metodo');
let tab = 'entender';

function pintarLista() {
  const f = $('#q').value.trim().toLowerCase();
  const visibles = R.filter((r) => !f || (r.n + ' ' + r.sec + ' ' + r.s).toLowerCase().includes(f));
  let html = f ? '' : `<button data-s="_metodo" aria-current="${actual === '_metodo'}">★ Método de visita</button>`;
  let sec = '';
  for (const r of visibles) {
    if (r.sec !== sec) { sec = r.sec; html += `<div class="sec">${sec}</div>`; }
    const n = mem.get('d:' + r.s, []).length;
    html += `<button data-s="${r.s}" aria-current="${actual === r.s}"><span>${r.n}</span>${n ? `<i>${n} ✓</i>` : ''}</button>`;
  }
  $('#lista').innerHTML = html || '<div class="sec">Sin resultados</div>';
}

function metodo() {
  return `
  <div class="top"><div><div class="tag">Empieza aquí</div><h2>Método de visita</h2></div></div>
  <div class="card"><h3>La idea en una línea</h3>
    <p>No vendes un sistema: vendes el dinero y el tiempo que hoy se le van al negocio sin que el dueño lo vea. Primero preguntas, luego le pones número a la fuga y hasta el final enseñas la demo.</p></div>
  <div class="card"><h3>Los 6 pasos de una visita (15 a 20 minutos)</h3><ol>
    <li><b>Llega en hora tranquila.</b> Nunca en hora pico. Preséntate en una frase: «Ayudo a negocios como el tuyo a dejar la libreta y el Excel».</li>
    <li><b>Gancho.</b> Una sola pregunta que duela (pestaña Speech). Calla y escucha.</li>
    <li><b>Diagnóstico.</b> Haz 3 o 4 preguntas y marca los problemas que el dueño reconozca. No ofrezcas nada todavía.</li>
    <li><b>Número.</b> Con sus propios datos, calcula cuánto pierde al mes (pestaña Números). Que el número lo diga él.</li>
    <li><b>Demo en su mano.</b> Dale tu celular o que escanee el QR del volante. Que toque él. Enseña solo lo que resuelve lo que marcó.</li>
    <li><b>Siguiente paso pequeño.</b> No cierres la venta: cierra una segunda cita o una prueba. Manda la propuesta por WhatsApp ese mismo día.</li></ol></div>
  <div class="card"><h3>Cómo proponer: tres fases, nunca todo junto</h3><ul>
    <li><b>Fase 1 · Ordenar:</b> lo mínimo que quita el dolor principal. Debe estar funcionando en días, no en meses.</li>
    <li><b>Fase 2 · Controlar:</b> reportes, comisiones, inventario; lo que le deja ver su negocio.</li>
    <li><b>Fase 3 · Crecer:</b> pagos en línea, campañas, varias sucursales.</li></ul>
    <p class="nota">El cliente compra la fase 1. Las otras dos le muestran que hay camino y justifican quedarse contigo.</p></div>
  <div class="card"><h3>Objeciones que salen en todos los rubros</h3>
    <details><summary>«Está caro» / «ahorita no hay dinero»</summary><p>No discutas el precio, regresa al número: «Dijimos que se te van como X al mes. ¿En cuántos meses se paga?». Ofrece empezar solo con la fase 1.</p></details>
    <details><summary>«Yo no le sé a la tecnología»</summary><p>«¿Usas WhatsApp? Es igual de fácil. Yo te lo dejo configurado y te enseño a ti y a tu gente; no te dejo solo.»</p></details>
    <details><summary>«Así como estoy me funciona»</summary><p>«Qué bueno, se nota que el negocio camina. Esto no es para cambiarlo, es para que veas en números lo que hoy calculas a ojo.» Y vuelve a una pregunta del diagnóstico.</p></details>
    <details><summary>«Ya uso Excel»</summary><p>«El Excel guarda lo que le escribes, pero no avisa, no cobra y no manda mensajes. Y solo lo entiende quien lo hizo.»</p></details>
    <details><summary>«Déjame pensarlo»</summary><p>«Claro. ¿Qué es lo que te deja con duda: el precio, el tiempo o si tu gente lo va a usar?» Resuelve esa duda y agenda una fecha concreta para volver.</p></details>
    <details><summary>«¿Y si se cae el internet o se pierde todo?»</summary><p>«La información queda respaldada fuera de tu local. Hoy, si se moja o se pierde la libreta, no hay copia.» Sé honesto: sin internet algunas funciones esperan a que vuelva.</p></details>
    <details><summary>«Mi sobrino me lo puede hacer»</summary><p>«Qué bien. La diferencia es que yo ya lo tengo hecho y probado para tu giro, y te doy soporte cuando algo falle.»</p></details></div>
  <div class="card"><h3>Lo que no debes prometer</h3><ul>
    <li>Las demos tienen datos de ejemplo. Un sistema real necesita configuración, carga de datos y servidor: di cuánto tarda.</li>
    <li>Los mensajes automáticos de WhatsApp a muchos clientes requieren la versión de negocios de WhatsApp y tienen costo por mensaje. Al inicio pueden salir con un toque desde el celular del negocio.</li>
    <li>Cobro con tarjeta y ligas de pago dependen de un procesador de pagos que cobra comisión.</li>
    <li>Facturación y timbrado de nómina pasan por un proveedor autorizado por el SAT; no es parte de la fase 1.</li>
    <li>Con datos de salud o de menores, ofrece siempre aviso de privacidad, usuarios con contraseña y respaldo.</li></ul></div>`;
}

function vista(r) {
  const marcados = mem.get('d:' + r.s, []);
  const pq = mem.get('q:' + r.s, []);
  const v = mem.get('c:' + r.s, [r.c[1], r.c[3]]);
  const p = {
    entender: () => `
      <div class="card"><h3>Cómo gana y dónde pierde dinero</h3><p>${r.e}</p></div>
      <div class="card"><h3>Dónde le duele</h3>${r.d.map((d) => `<div class="dolor"><span aria-hidden="true">●</span><div><b>${d[0]}</b><span class="cuesta">Le cuesta: ${d[1]}</span></div></div>`).join('')}</div>
      <div class="card"><h3>Lo que el dueño debería medir</h3><ul>${r.k.map((k) => `<li>${k}</li>`).join('')}</ul></div>`,
    diag: () => `
      <div class="card"><h3>Preguntas para hacerle</h3><p class="nota">Marca las que ya hiciste. Deja que hable: la respuesta es tu argumento.</p>
        ${r.q.map((q, i) => `<label class="chk"><input type="checkbox" data-q="${i}" ${pq.includes(i) ? 'checked' : ''}><span>${q}</span></label>`).join('')}</div>
      <div class="card"><h3>Problemas que el dueño reconoció</h3><p class="nota">Lo que marques aquí arma la propuesta.</p>
        ${r.d.map((d, i) => `<label class="dolor"><input type="checkbox" data-d="${i}" ${marcados.includes(i) ? 'checked' : ''}><div><b>${d[0]}</b><span class="cuesta">Le cuesta: ${d[1]}</span><br><span class="sol">Le implemento: ${d[2]}</span></div></label>`).join('')}</div>
      <div class="card"><h3>Notas de la visita</h3><textarea id="notas" placeholder="Nombre del dueño, qué usa hoy, cuántos empleados, cuándo volver…">${esc(mem.get('n:' + r.s, ''))}</textarea></div>`,
    speech: () => `
      <div class="card speech"><h3>1 · Gancho (la pregunta que abre)</h3><p class="gancho">${r.sp[0]}</p></div>
      <div class="card speech"><h3>2 · Pitch (un minuto)</h3><p>${r.sp[1]}</p></div>
      <div class="card speech"><h3>3 · Cierre (siguiente paso)</h3><p>${r.sp[2]}</p></div>
      <button class="btn sec" data-copia="${esc(r.sp.join('\n\n'))}">Copiar speech</button><span class="ok" hidden>Copiado</span>`,
    impl: () => `
      <div class="fases">${['Fase 1 · Ordenar', 'Fase 2 · Controlar', 'Fase 3 · Crecer'].map((t, i) => `<div class="card"><div class="n">${t}</div><ul>${r.f[i].map((x) => `<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>
      <div class="card" style="margin-top:14px"><h3>Automatizaciones que impresionan</h3><ul>${r.a.map((x) => `<li>${x}</li>`).join('')}</ul></div>
      <div class="card"><h3>Qué enseñar en la demo</h3><p>${r.demo}</p><a class="btn" target="_blank" rel="noopener" href="${SITIO}proyectos/${r.s}/">Abrir la demo ↗</a></div>`,
    obj: () => `
      <div class="card"><h3>Objeciones de este rubro</h3>${r.o.map((o) => `<details><summary>«${o[0]}»</summary><p>${o[1]}</p></details>`).join('')}
      <p class="nota" style="margin-top:12px">Las de precio, tecnología y «déjame pensarlo» están en Método de visita.</p></div>`,
    num: () => `
      <div class="card"><h3>¿Cuánto se le va al mes?</h3><p class="nota">Cambia los números por los que te diga el dueño. Los valores iniciales son solo un ejemplo, no un dato del sector.</p>
        <div class="calc"><div><label for="ca">${r.c[0]}</label><input id="ca" type="number" min="0" step="any" inputmode="decimal" value="${v[0]}"></div>
        <div><label for="cb">${r.c[2]}</label><input id="cb" type="number" min="0" step="any" inputmode="decimal" value="${v[1]}"></div></div>
        <div class="res"><div>Al mes<b id="rm"></b></div><div>Al año<b id="ra"></b></div></div></div>
      <div class="card"><h3>Indicadores para darle seguimiento</h3><ul>${r.k.map((k) => `<li>${k}</li>`).join('')}</ul></div>`,
    prop: () => `
      <div class="card"><h3>Propuesta para mandar por WhatsApp</h3>
        <p class="nota">Se arma con los problemas marcados en Diagnóstico y el cálculo de Números. Edítala antes de enviarla.</p>
        <p><input id="cli" placeholder="Nombre del dueño o del negocio" value="${esc(mem.get('cli:' + r.s, ''))}" style="width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px"></p>
        <textarea id="ptxt" style="min-height:300px"></textarea>
        <p style="margin-top:10px"><button class="btn" data-copia-de="ptxt">Copiar propuesta</button><span class="ok" hidden>Copiado</span>
        <button class="btn sec" id="limpiar">Borrar datos de este rubro</button></p></div>`,
  };
  return `
  <div class="top"><div><div class="tag">${r.sec}</div><h2>${r.n}</h2></div>
    <a class="btn sec" target="_blank" rel="noopener" href="${SITIO}proyectos/${r.s}/">Ver demo ↗</a></div>
  <div class="tabs" role="tablist">${TABS.map(([k, t]) => `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${t}</button>`).join('')}</div>
  <div role="tabpanel">${p[tab]()}</div>`;
}

function perdida(r) {
  const v = mem.get('c:' + r.s, [r.c[1], r.c[3]]);
  return (Number(v[0]) || 0) * (Number(v[1]) || 0) * r.c[4];
}

function propuesta(r) {
  const idx = mem.get('d:' + r.s, []);
  const sel = (idx.length ? idx : [0, 1, 2]).map((i) => r.d[i]);
  const cli = mem.get('cli:' + r.s, '').trim();
  const m = perdida(r);
  return [
    `Hola${cli ? ' ' + cli : ''}, soy de NarIT. Gracias por tu tiempo hoy.`,
    '',
    'Por lo que platicamos, esto es lo que más te está costando:',
    ...sel.map((d) => `• ${d[0]}`),
    '',
    m ? `Con los números que me diste, eso representa cerca de ${pesos(m)} al mes (${pesos(m * 12)} al año).` : '',
    '',
    'Lo que te propongo para empezar:',
    ...sel.map((d) => `✓ ${d[2]}`),
    '',
    'Empezamos con lo esencial y lo usas desde tu celular. Después, si te sirve, agregamos lo demás.',
    '',
    `Aquí puedes probar un ejemplo: ${SITIO}proyectos/${r.s}/`,
    '',
    '¿Te parece si paso el ______ para dejarlo listo con tus datos?',
  ].filter((l, i, a) => !(l === '' && a[i - 1] === '')).join('\n');
}

function pintar() {
  const r = R.find((x) => x.s === actual);
  $('#main').innerHTML = r ? vista(r) : metodo();
  pintarLista();
  if (!r) return;
  if (tab === 'num') calc(r);
  if (tab === 'prop') $('#ptxt').value = propuesta(r);
}

function calc(r) {
  const v = [$('#ca').value, $('#cb').value];
  mem.set('c:' + r.s, v);
  const m = perdida(r);
  $('#rm').textContent = pesos(m);
  $('#ra').textContent = pesos(m * 12);
}

$('#q').addEventListener('input', pintarLista);
$('#lista').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-s]'); if (!b) return;
  actual = b.dataset.s; tab = 'entender'; mem.set('actual', actual); pintar(); scrollTo(0, 0);
  if (matchMedia('(max-width:820px)').matches) $('#main').scrollIntoView();
});
$('#main').addEventListener('click', async (e) => {
  const t = e.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; pintar(); return; }
  const c = e.target.closest('[data-copia],[data-copia-de]');
  if (c) {
    const txt = c.dataset.copia ?? $('#' + c.dataset.copiaDe).value;
    try { await navigator.clipboard.writeText(txt); c.nextElementSibling.hidden = false; setTimeout(() => (c.nextElementSibling.hidden = true), 1500); }
    catch { prompt('Copia el texto:', txt); }
    return;
  }
  if (e.target.id === 'limpiar' && confirm('¿Borrar marcas, notas y números de este rubro?')) {
    ['d', 'q', 'n', 'c', 'cli'].forEach((k) => { try { localStorage.removeItem('narit-guia:' + k + ':' + actual); } catch {} });
    pintar();
  }
});
$('#main').addEventListener('input', (e) => {
  const r = R.find((x) => x.s === actual); if (!r) return;
  const el = e.target;
  if (el.dataset.d || el.dataset.q) {
    const k = el.dataset.d ? 'd' : 'q';
    const set = new Set(mem.get(k + ':' + r.s, []));
    const i = Number(el.dataset[k]);
    el.checked ? set.add(i) : set.delete(i);
    mem.set(k + ':' + r.s, [...set].sort());
    pintarLista();
  } else if (el.id === 'notas') mem.set('n:' + r.s, el.value);
  else if (el.id === 'ca' || el.id === 'cb') calc(r);
  else if (el.id === 'cli') { mem.set('cli:' + r.s, el.value); $('#ptxt').value = propuesta(r); }
});

if (R.length !== 24 || malos.length) document.body.insertAdjacentHTML('afterbegin', '<p style="background:#B3261E;color:#fff;padding:8px;margin:0">Faltan datos en la guía: revisa la consola.</p>');
pintar();
</script>
</body>
</html>
